framework:
  default_locale: fr

services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: true

  Wexample\SymfonyMoney\Service\MoneyFormatter:
    arguments:
      $defaultLocale: fr

doctrine:
  orm:
    mappings:
      Fixtures:
        type: attribute
        is_bundle: false
        dir: '%kernel.project_dir%/Entity'
        prefix: 'Wexample\SymfonyAccountingBe\Tests\Fixtures\App\Entity'
    resolve_target_entities:
      Wexample\SymfonyHelpers\Entity\Interfaces\UserEntityInterface: Wexample\SymfonyAccountingBe\Tests\Fixtures\App\Entity\TestAccount
